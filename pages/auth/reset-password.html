<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KGECSIH | Reset Password</title><link rel="stylesheet" href="/pages/auth/auth.css"></head>
<body><div class="auth-page"><section class="auth-section" style="grid-column:1/-1"><div class="auth-box">
<div class="form-heading"><h2>Reset your password</h2><p>Create a new password for your KGECSIH account.</p></div>
<form id="resetForm"><div class="input-group"><label for="newPassword">New Password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div>
<div class="input-group"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
<button class="submit-button" type="submit">Update Password <span>→</span></button><div id="resetMessage" class="message"></div></form>
</div></section></div><script src="/pages/auth/reset-password.js"></script></body></html>
